<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModernDo – To-Do List App</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">✅</span>
          <span class="logo-text">ModernDo</span>
        </div>
        <p class="header-date" id="headerDate"></p>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Ganti Tema">
        <span class="theme-icon" id="themeIcon">🌙</span>
        <span class="theme-label" id="themeLabel">Dark Mode</span>
      </button>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main class="main">

    <!-- Progress Section -->
    <section class="progress-section glass-card">
      <div class="progress-info">
        <div class="stat-box">
          <span class="stat-number" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-box">
          <span class="stat-number active-color" id="activeCount">0</span>
          <span class="stat-label">Aktif</span>
        </div>
        <div class="stat-box">
          <span class="stat-number done-color" id="doneCount">0</span>
          <span class="stat-label">Selesai</span>
        </div>
        <div class="stat-box">
          <span class="stat-number overdue-color" id="overdueCount">0</span>
          <span class="stat-label">Terlambat</span>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
    </section>

    <!-- Add Task Section -->
    <section class="add-section glass-card">
      <h2 class="section-title">Tambah Tugas Baru</h2>
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="taskInput">Nama Tugas <span class="required">*</span></label>
          <input
            type="text"
            id="taskInput"
            placeholder="Masukkan nama tugas..."
            maxlength="200"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="prioritySelect">Prioritas</label>
          <select id="prioritySelect">
            <option value="medium">🟡 Sedang</option>
            <option value="high">🔴 Tinggi</option>
            <option value="low">🟢 Rendah</option>
          </select>
        </div>
        <div class="form-group">
          <label for="deadlineInput">Deadline</label>
          <input type="datetime-local" id="deadlineInput" />
        </div>
        <div class="form-group full-width">
          <label for="noteInput">Catatan (opsional)</label>
          <input
            type="text"
            id="noteInput"
            placeholder="Tambahkan catatan singkat..."
            maxlength="300"
          />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="addBtn">
          <span>＋</span> Tambah Tugas
        </button>
        <button class="btn btn-outline" id="clearFormBtn">
          <span>✕</span> Bersihkan
        </button>
      </div>
    </section>

    <!-- Control Section -->
    <section class="control-section">
      <!-- Search -->
      <div class="search-wrap glass-card">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Cari tugas..."
          autocomplete="off"
        />
        <button class="clear-search" id="clearSearch" title="Hapus Pencarian">✕</button>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs glass-card">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="active">Aktif</button>
        <button class="filter-btn" data-filter="done">Selesai</button>
        <button class="filter-btn" data-filter="overdue">Terlambat</button>
      </div>

      <!-- Sort & Actions -->
      <div class="sort-actions glass-card">
        <div class="sort-wrap">
          <label for="sortSelect">Urutkan:</label>
          <select id="sortSelect">
            <option value="newest">Terbaru</option>
            <option value="oldest">Terlama</option>
            <option value="priority">Prioritas</option>
            <option value="deadline">Deadline</option>
            <option value="alpha">A–Z</option>
          </select>
        </div>
        <div class="action-btns">
          <button class="btn btn-danger-outline" id="clearDoneBtn">
            🗑️ Hapus Selesai
          </button>
          <button class="btn btn-export" id="exportBtn">
            📤 Ekspor TXT
          </button>
          <label class="btn btn-import" for="importFile">
            📥 Impor TXT
          </label>
          <input type="file" id="importFile" accept=".txt" style="display:none" />
        </div>
      </div>
    </section>

    <!-- Task List -->
    <section class="task-section">
      <div class="task-list" id="taskList">
        <!-- Tasks rendered by JS -->
      </div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📋</div>
        <p class="empty-title">Belum ada tugas</p>
        <p class="empty-sub">Tambahkan tugas baru di atas untuk memulai!</p>
      </div>
    </section>

  </main>

  <!-- ===================== EDIT MODAL ===================== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal glass-card">
      <div class="modal-header">
        <h3>✏️ Edit Tugas</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group full-width">
          <label>Nama Tugas <span class="required">*</span></label>
          <input type="text" id="editTaskInput" maxlength="200" />
        </div>
        <div class="form-group">
          <label>Prioritas</label>
          <select id="editPrioritySelect">
            <option value="high">🔴 Tinggi</option>
            <option value="medium">🟡 Sedang</option>
            <option value="low">🟢 Rendah</option>
          </select>
        </div>
        <div class="form-group">
          <label>Deadline</label>
          <input type="datetime-local" id="editDeadlineInput" />
        </div>
        <div class="form-group full-width">
          <label>Catatan</label>
          <input type="text" id="editNoteInput" maxlength="300" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveEditBtn">💾 Simpan</button>
        <button class="btn btn-outline" id="cancelEditBtn">Batal</button>
      </div>
    </div>
  </div>

  <!-- ===================== TOAST ===================== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <p>ModernDo v2.0.0 &nbsp;|&nbsp; Built with ❤️ using HTML, CSS &amp; JavaScript</p>
    <p class="footer-sub">Data tersimpan otomatis di Local Storage browser Anda</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
